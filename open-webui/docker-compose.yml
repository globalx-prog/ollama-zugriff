# Open WebUI — Docker Compose (Migration aus `docker run`)
#
# Sicherheitsänderung ggü. vorher:
#   - Port nur noch auf 127.0.0.1 gebunden (war 0.0.0.0:3000)
#     -> nicht mehr aus LAN/WAN erreichbar, nur noch lokal,
#        Tailscale und über den Cloudflare-Tunnel.
#   - Image gepinnt auf stabiles Release (war :main, moving target)
#   - WEBUI_SECRET_KEY gesetzt (war leer → Zufall bei Neustart)
#   - Container-Härtung: cap_drop ALL, no-new-privileges, pids_limit, read_only
#
# WICHTIG (Ollama-Verbindung):
#   extra_hosts: host.docker.internal:host-gateway  MUSS bleiben,
#   sonst kann Open WebUI den Ollama-Server nicht erreichen
#   (OLLAMA_BASE_URL=http://host.docker.internal:11434).
#
# Start:  docker compose -f cloudflare/open-webui/docker-compose.yml up -d
# Stopp:  docker compose -f cloudflare/open-webui/docker-compose.yml down
name: open-webui

services:
  open-webui:
    # Gepinnt auf stabiles Release. Version-Variable aus .env;
    # Fallback v0.11.4 falls .env fehlt.
    image: ghcr.io/open-webui/open-webui:${OWUI_VERSION:-v0.11.4}
    container_name: open-webui
    restart: unless-stopped
    # Ollama läuft auf dem Host (systemd, nicht in Docker). Erreichbarkeit
    # aus dem Container — zwei konsistente Endzustände (Details + Live-Test in
    # cloudflare_tunnel_safety_sicherung.md, Abschnitt "Ollama härten"):
    #
    #   Endzustand B (EMPFOHLEN, härteste): Ollama auf Tailscale-IP binden
    #     (OLLAMA_HOST=100.102.224.36:11434) -> hier die Tailscale-IP nutzen.
    #     Live-verifiziert: dieser Container erreicht 100.102.224.36:11434.
    #
    #   Endzustand A (Fallback, Firewall): Ollama bleibt 0.0.0.0:11434 +
    #     UFW-Regeln -> dann host.docker.internal statt Tailscale-IP nutzen.
    #
    # WICHTIG (Lockstep): host.docker.internal zeigt auf das
    # Docker-Desktop-VM-Gateway, NICHT auf die Tailscale-IP. Bindet Ollama
    # daher NUR auf die Tailscale-IP, funktioniert host.docker.internal NICHT
    # mehr -> dann zwingend die Tailscale-IP in OLLAMA_BASE_URL verwenden.
    # Die Tailscale-IP vorher mit `tailscale ip -4` prüfen (hier: 100.102.224.36).
    extra_hosts:
      # Bleibt als Fallback für Endzustand A (host.docker.internal) erhalten.
      - "host.docker.internal:host-gateway"
    # WEBUI_SECRET_KEY und OWUI_VERSION aus .env laden.
    env_file: .env
    environment:
      # Ollama auf dem Host, erreichbar über die Tailscale-IP (Endzustand B).
      OLLAMA_BASE_URL: http://100.102.224.36:11434
      # Registrierung hart abschalten. (In dieser Version ist
      # ENABLE_SIGNUP die gültige Env-Variable, gelesen in config.py.)
      # DB-hatte ui.enable_signup=false bereits; das macht es explizit.
      ENABLE_SIGNUP: "false"
    ports:
      # Nur auf Loopback binden (Sicherheits-Härtung).
      - "127.0.0.1:3000:8080"
    volumes:
      # Bestehender Named Volume mit den vorhandenen Daten (~1.1 GB) wird
      # wiederverwendet -> kein Datenverlust.
      - open-webui:/app/backend/data
    networks:
      # ai-network: für den DNS-Namen "searxng" (interne Web-Suche) und
      # damit cloudflared das Tunnel-Ziel http://open-webui:8080 erreichen
      # kann (gleicher Container-Name als Alias im Docker-DNS).
      - ai-network
    # --- Container-Härtung ---
    # Alle Linux-Capabilities entfernen (OWUI braucht keine).
    cap_drop: [ALL]
    # Privilege-Escalation verhindern.
    security_opt:
      - no-new-privileges:true
    # Prozess-Limit gegen Fork-Bombs.
    pids_limit: 512
    # Dateisystem read-only; Schreibzugriff nur über Volumes und tmpfs.
    read_only: true
    tmpfs:
      - /tmp
      - /app/backend/data/cache

volumes:
  open-webui:
    # Wiederverwendung des bereits existierenden Named Volumes
    # (global "open-webui") -> wird NICHT neu angelegt.
    external: true

networks:
  ai-network:
    external: true
